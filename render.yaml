services:
  - type: web
    name: bhufix
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8000
      - key: DB_NAME
        value: bhufix_db
      - key: MONGO_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: CLOCKIN_FACE_MODE
        value: dev
      - key: WHATSAPP_VERIFY_TOKEN
        value: bhufix-clockin-verify
      - key: AWS_DEFAULT_REGION
        value: ap-south-1
